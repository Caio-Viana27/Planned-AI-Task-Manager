services:
  task-manager-api:
    build:
      context: ./AI-Task-Manager-API
    container_name: task-manager-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TASK_MANAGER_DB_URL: ${TASK_MANAGER_DB_URL}
      AI_PROVIDER: ${AI_PROVIDER:-google-genai}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE}
    ports:
     - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      task-manager-db:
        condition: service_healthy
        restart: true

  task-manager-ui:
    build:
      context: ./AI-Task-Manager-UI
    container_name: task-manager-ui
    ports:
      - 5173:80
    depends_on:
      task-manager-api:
        condition: service_healthy
        restart: true

  task-manager-db:
    image: postgres:18-bookworm
    container_name: task-manager-db
    ports:
      - "5432:5432"
    volumes:
      - ./init-task-manager-db:/docker-entrypoint-initdb.d
      - task_manager_db_volume:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d task_manager_db"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  task_manager_db_volume:
